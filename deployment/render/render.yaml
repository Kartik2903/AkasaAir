# Render Blueprint. Copy to repo root as render.yaml (Render only auto-detects it there),
# push to GitHub, then Render > New > Blueprint. See docs/deployment.md.
databases:
  - name: leaveflow-db
    plan: free            # free Postgres expires after 30 days; use a paid plan for anything lasting
    databaseName: leaveflow

services:
  - type: web
    name: leaveflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate --schema server/prisma/schema.prisma
    # Migrations run on boot via `migrate deploy` (never `migrate dev` in production).
    # On paid plans prefer preDeployCommand: npm run db:deploy -w server
    startCommand: npm run db:deploy -w server && npm start
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: leaveflow-db, property: connectionString } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: COOKIE_SAMESITE, value: none }        # static site and API are different sites
      - { key: UPLOAD_DIR, value: /var/data/uploads } # needs a persistent disk (paid) or S3: see docs/deployment.md
      - { key: CLIENT_ORIGIN, sync: false }          # set to the static site URL after first deploy

  - type: web
    name: leaveflow-web
    runtime: static
    buildCommand: npm ci && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - { key: VITE_API_URL, sync: false }           # the API URL, e.g. https://leaveflow-api.onrender.com
    routes:
      - { type: rewrite, source: /*, destination: /index.html }   # SPA routing
